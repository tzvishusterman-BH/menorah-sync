<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Berlin Menorah Parade 5786</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root{
    --accent:#4da3ff;       /* blue accent */
    --accent2:#2b7dff;
    --card: rgba(8, 16, 30, 0.72);
    --border: rgba(255,255,255,0.14);
    --textSoft: rgba(255,255,255,0.82);
  }

  body{
    margin:0;
    font-family: Arial, sans-serif;
    color:#fff;
    background:url("flyer.jpg") center/cover no-repeat fixed;
  }

  .overlay{
    min-height:100vh;
    background:rgba(0,0,0,0.62);
    padding:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    text-align:center;
  }

  h1{
    margin:10px 0 0;
    color:var(--accent);
    font-size:34px;
    font-weight:900;
    text-shadow: 0 2px 14px rgba(77,163,255,0.25);
  }

  .card{
    width:min(560px, 94vw);
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px;
    backdrop-filter: blur(6px);
  }

  .row{
    display:flex;
    gap:10px;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
  }

  select,input,button{
    padding:12px;
    border-radius:12px;
    border:0;
    font-size:16px;
    font-weight:800;
  }

  select{
    background:rgba(77,163,255,0.92);
    color:#001226;
    cursor:pointer;
  }

  input{
    width:min(440px, 84vw);
    background:rgba(0,0,0,0.45);
    color:#fff;
    border:1px solid rgba(255,255,255,0.18);
  }

  button{
    cursor:pointer;
    background:var(--accent);
    color:#001226;
    min-width:160px;
    box-shadow: 0 10px 28px rgba(77,163,255,0.14);
  }
  button:hover{ background:var(--accent2); }
  button:disabled{
    opacity:0.45;
    cursor:not-allowed;
    box-shadow:none;
  }

  .statusWrap{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
    margin-top:10px;
    flex-wrap:wrap;
  }

  .pill{
    padding:8px 12px;
    border-radius:999px;
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.14);
    font-weight:900;
  }
  .pill.good{ border-color: rgba(77,163,255,0.75); }
  .pill.bad{ border-color: rgba(255,90,90,0.65); }

  .hint{
    color:var(--textSoft);
    font-size:14px;
    line-height:1.35;
    margin-top:8px;
  }

  .flyerFrame{
    width:min(560px, 94vw);
    border-radius:18px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.10);
    background:rgba(0,0,0,0.25);
  }
  .flyerFrame img{
    width:100%;
    height:auto;
    display:block;
  }
</style>
</head>

<body>
<div class="overlay">

    <audio id="iosPlayer" playsinline preload="auto" style="display:none;"></audio>

  <div class="row" style="width:100%; justify-content:flex-end;">
    <select id="langSelect" title="Language">
      <option value="en">EN</option>
      <option value="he">HE</option>
      <option value="ru">RU</option>
      <option value="de">DE</option>
    </select>
  </div>

  <h1>Berlin Menorah Parade 5786</h1>

  <div class="card">
    <div style="font-weight:900; font-size:18px; margin-bottom:10px;">
      Family name (required to arm)
    </div>

    <input id="familyName" autocomplete="family-name" placeholder="">

    <div class="row" style="margin-top:12px;">
      <button id="armBtn" disabled>ARM AUDIO</button>
      <button id="pauseBtn" style="display:none;">PAUSE</button>
    </div>

    <div class="statusWrap">
      <div id="statusPill" class="pill bad">Status: Not Armed</div>
      <div id="nowPlayingPill" class="pill">Now Playing: —</div>
    </div>

    <div class="hint">
      If the audio ever feels out of sync, <b>refresh the page</b> to re-sync with everyone.
    </div>
  </div>

  <!-- Flyer visible on the page (not just as background) -->
  <div class="flyerFrame">
    <img src="flyer.jpg" alt="Berlin Menorah Parade Flyer">
  </div>

</div>

<script src="client.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Berlin Menorah Parade 5786</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --accent:#4da3ff;
      --card: rgba(8, 16, 30, 0.75);
      --border: rgba(255,255,255,0.14);
    }
    body{
      margin:0;
      font-family: Arial, sans-serif;
      color:#fff;
      background:url("flyer.jpg") center/cover no-repeat fixed;
    }
    .overlay{
      min-height:100vh;
      background:rgba(0,0,0,0.55);
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:18px;
    }
    .card{
      width:min(560px, 94vw);
      margin-top:16px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:16px;
      backdrop-filter: blur(6px);
    }
    h1{
      margin:0 0 12px;
      color:var(--accent);
      font-size:26px;
      font-weight:900;
    }
    input, button{
      width:100%;
      padding:14px;
      border-radius:14px;
      border:0;
      font-size:16px;
      font-weight:900;
      box-sizing:border-box;
    }
    input{
      margin-bottom:10px;
      background:rgba(0,0,0,0.45);
      border:1px solid rgba(255,255,255,0.18);
      color:#fff;
    }
    button{
      cursor:pointer;
      background:var(--accent);
      color:#001226;
    }
    button.secondary{
      background:rgba(255,255,255,0.14);
      color:#fff;
      margin-top:10px;
      display:none;
    }
    .pill{
      display:block;
      margin-top:10px;
      padding:10px 12px;
      border-radius:999px;
      background:rgba(255,255,255,0.10);
      border:1px solid rgba(255,255,255,0.14);
      font-weight:900;
      font-size:14px;
    }
    .hint{
      opacity:0.9;
      font-size:13px;
      margin-top:8px;
      line-height:1.35;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="card">
      <h1>Berlin Menorah Parade 5786</h1>

      <input id="familyName" placeholder="Family name" autocomplete="name" />
      <button id="armBtn">ARM AUDIO</button>
      <button id="pauseBtn" class="secondary">PAUSE</button>

      <span id="statusPill" class="pill">Status: Not Armed</span>
      <span id="nowPlayingPill" class="pill">Now Playing: —</span>

      <div class="hint">
        If you join late: enter your family name → ARM AUDIO. <br/>
        If it ever feels off: tap PLAY again (it re-syncs to the parade clock).
      </div>

      <audio id="iosPlayer" preload="auto"></audio>
    </div>
  </div>

  <script src="client.js"></script>
</body>
</html>
